name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  # Quality gates — run on every push and pull request.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history (needed once git-revision-date is re-enabled)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies (reproducible, from poetry.lock)
        run: poetry install --only main --no-root

      # HARD GATE: fails the build on any broken internal link or config warning.
      - name: Strict build
        run: poetry run mkdocs build --strict

      # ADVISORY (non-blocking) gates. Surface issues without failing CI while the legacy
      # content backlog (frontmatter, style) is worked down. Flip continue-on-error to
      # false to make them blocking once the backlog is clean.
      - name: Lint Markdown (advisory)
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "docs/**/*.md"

      - name: Check links (advisory)
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail "docs/**/*.md"
          fail: true

  # Build with social cards + deploy to GitHub Pages — only on push to master.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    env:
      CI: "true" # enables the env-gated social-cards plugin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Native libraries required by the social-cards plugin (Cairo / Pango / etc.)
      - name: Install system dependencies for social cards
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev \
            libjpeg-dev libpng-dev libz-dev pngquant

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --only main --no-root

      # Cache the rendered social cards between runs (keyed weekly).
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Deploy to GitHub Pages
        run: poetry run mkdocs gh-deploy --force
